# Docker Compose for circleci-mcp / circleci-cost-mcp
#
# Both services run the same published GHCR image
# (ghcr.io/nickbrett1/circleci-mcp). watchtower-nick (scope=nick, 60s poll)
# auto-updates them on every new GHCR publish.
#
# Deploy: docker compose up -d   (import as a Container Manager "Project" on NAS)
#
# image: ghcr.io/nickbrett1/circleci-mcp:latest
# env_file ./.env -> CIRCLE_TOKEN (never commit). Copy .env.example to .env.

services:
  circleci-mcp:
    # mcpo bridge (OpenAPI/SSE) exposing the CircleCI CLI MCP + curated server
    # to Open WebUI. Single curated toolset defined in /app/config.json.
    image: ghcr.io/nickbrett1/circleci-mcp:latest
    container_name: circleci-mcp
    restart: always
    mem_limit: 512m
    memswap_limit: 512m
    ports:
      - "127.0.0.1:8767:8767"
    environment:
      - TZ=US/Eastern
    env_file:
      - .env
    command: ["--config", "/app/config.json", "--port", "8767"]
    networks:
      - default
      - ai_proxy
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.scope=nick"

  circleci-cost-mcp:
    # Native MCP-over-HTTP (Streamable HTTP) for the same curated server, so any
    # MCP client (goose, claude, cursor, ...) can hit http://circleci-cost-mcp:8768/mcp
    # directly instead of going through mcpo's OpenAPI bridge.
    image: ghcr.io/nickbrett1/circleci-mcp:latest
    container_name: circleci-cost-mcp
    restart: always
    mem_limit: 256m
    memswap_limit: 256m
    entrypoint: ["python3"]          # image default ENTRYPOINT is mcpo; override
    command: ["/app/circleci_server.py"]
    ports:
      - "127.0.0.1:8768:8768"
    environment:
      - TZ=US/Eastern
      - TRANSPORT=streamable-http
      - FASTMCP_HOST=0.0.0.0
      - FASTMCP_PORT=8768
    env_file:
      - .env
    networks:
      - default
      - ai_proxy
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.scope=nick"

networks:
  ai_proxy:
    external: true
