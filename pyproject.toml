[project]
name = "circleci-mcp"
version = "0.1.0"
description = "A circleci-mcp project generated with genproj"
readme = "README.md"
requires-python = ">=3.11"
# NOTE: mcpo is the Docker BASE IMAGE (see Dockerfile: FROM ghcr.io/open-webui/mcpo:main),
# not a pip dependency of this repo — do not list it here.
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
src = ["src", "tests"]
